<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    
    <form id="formLogin">
        <img src="images/nextgen.png" alt="Logo NextGen" id="nextgenLogo">
            <div class="boxTitle">
                <h2 class="title">Email</h2>
                <input type="email" name="email" id="emailInput">
            </div>
            <div class="boxTitle">
                <h2 class="title">Password</h2>
                <input type="password" name="password" id="passwordInput" autocomplete="current-password">
                <img src="images/olho-revelar.png" alt="Ver Senha" id="seePassword">
            </div>
            <button type="submit" id="buttonEntrar">Entrar</button>
            <button type="submit" id="buttonCadastrar">Cadastrar</button>
            <p id="entrarLogin">Já possui uma conta?</p>
    </form>

    
    <script src="login.js"></script>
</body>
</html>
